name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check . --select=E,F,W --ignore=E501,E402,W605 || true

      - name: Compile-check all Python files
        run: python -m compileall -q agents portal main.py config.py

      - name: Run tests
        env:
          # Dummy env so modules that read .env at import don't fail
          LLM_PROVIDER: mlx
          DB_BACKEND: json
        run: pytest -q tests/ || (echo "::warning::tests failed or none collected"; exit 0)

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: data

      - name: Syntax check (bash -n)
        run: |
          for f in install.sh run.sh; do
            echo "→ $f"
            bash -n "$f"
          done

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block committed .env / cookies / keys
        run: |
          set -e
          BAD=$(git ls-files | grep -E '^(\.env$|.*\.pem$|.*\.key$|cookies\.txt$)' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Sensitive files committed:"
            echo "$BAD"
            exit 1
          fi

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
